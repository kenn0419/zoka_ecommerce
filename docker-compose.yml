services:
  # --- Database ---
  postgres:
    image: postgres:15-alpine
    container_name: zoka-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-root}
      - POSTGRES_DB=${POSTGRES_DB:-zoka_ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zoka-network

  # --- Cache ---
  redis:
    image: redis:alpine
    container_name: zoka-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-123123az}
    networks:
      - zoka-network
    expose:
      - "6379"

  # --- Backend ---
  backend:
    build:
      context: ./server
    container_name: zoka-server
    restart: always
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-zoka_ecommerce}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123123az}
      - FE_URL=http://localhost
    depends_on:
      - postgres
      - redis
    networks:
      - zoka-network
    expose:
      - "3000"

  # --- Frontend + Reverse Proxy ---
  web:
    build:
      context: ./web
    container_name: zoka-web
    restart: always
    environment:
      # Use relative path to proxy through Nginx (port 80)
      - VITE_API_URL=/api/v1
    depends_on:
      - backend
    networks:
      - zoka-network
    ports:
      - "80:80"

networks:
  zoka-network:

volumes:
  postgres_data:
